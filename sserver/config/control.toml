
# 在底层 C++ 项目中，把端口号、设备路径、日志级别等参数从代码里抽离出来，放到配置文件（如 .toml）中，是极其标准的工业级做法。
# 这样你可以不重新编译代码，只需改一下文件并重启，就能改变程序的行为。

# 服务端配置。当前只有四个字段，随模块落地逐步扩充。
#
# 解析器是严格模式：未知表、未知键、类型不符、数值越界都会拒绝启动，
# 并在错误里给出「文件:行:列」。所以拼错键名不会静默退回默认值。

# 表(区块)
[control]
# 控制通道 TCP 监听端口，客户端要提前知道，因此不允许 0（0 会让内核随机分配）。
port = 9000
# 并发控制连接上限。
max_clients = 16

[capture]
# "auto" 表示启动采集时扫描 /dev/video*；写死路径则固定该设备，失败不自动换。
device = "auto"

[runtime]
# true 时输出 Debug 级别日志，等价于命令行打开 verbose。
log_verbose = false